<!DOCTYPE html>
<html lang="ko">

<title>기상안전 관제 · 본사 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root {
  color-scheme: light;
  --page:#eef2f5; --surface:#fdfdfd; --glass:rgba(252,253,254,.80); --glass-line:rgba(255,255,255,.65);
  --ink:#19273c; --ink2:#4d5560; --muted:#8a939d; --line:rgba(15,30,50,.08);
  --primary:#2b4775; --primary-2:#3a5a8f; --tint:#eaf1fb; --sage:#597f60;
  --r0:#cde2fb; --r1:#9ec5f4; --r2:#5598e7; --r3:#256abf; --r4:#0d366b; --cell:#e7ecf1;
  --w0:#e7ecf1; --w1:#c9e6dd; --w2:#6fb9a2; --w3:#2a7d66;
  --crit:#a3201f; --crit-bg:#fbe3e3; --warn:#7a5200; --warn-bg:#fdf0d2;
  --shadow:0 1px 2px rgba(15,30,50,.05), 0 10px 30px rgba(15,30,50,.10), 0 30px 80px rgba(15,30,50,.08);
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --radius:22px;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; overflow:hidden; background:var(--page); color:var(--ink); font-family:"Pretendard", system-ui, -apple-system, sans-serif; font-size:14px; -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
.num { font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }
.ic { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
#map { position:fixed; inset:0; }
.mapmsg { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); padding:12px 16px; border-radius:14px; background:var(--surface); box-shadow:var(--shadow); color:var(--ink2); font-size:13px; opacity:0; pointer-events:none; transition:opacity .4s; z-index:2; }
.mapmsg.show { opacity:1; }
.maplibregl-ctrl-attrib { font-size:10px; opacity:.7; }
.glass { background:var(--glass); backdrop-filter:blur(22px) saturate(1.5); -webkit-backdrop-filter:blur(22px) saturate(1.5); border:1px solid var(--glass-line); box-shadow:var(--shadow); }

/* ── top bar ── */
.top { position:fixed; top:16px; left:16px; right:16px; display:flex; align-items:center; gap:12px; z-index:5; pointer-events:none; }
.top > * { pointer-events:auto; }
.brand { display:flex; align-items:center; gap:10px; height:48px; padding:0 16px 0 10px; border-radius:16px; }
.logo { display:flex; align-items:center; gap:7px; height:30px; padding:0 9px; border:1.5px dashed #a9b2bc; border-radius:9px; font-size:11px; font-weight:700; color:#6d7782; white-space:nowrap; }
.logo i { width:16px; height:16px; border-radius:4px; background:linear-gradient(135deg,#FABE00 0 50%,#009944 50%); }
.brand b { font-size:15px; letter-spacing:-.2px; } .brand small { color:var(--muted); font-size:12px; margin-left:2px; }
.seg { position:relative; display:flex; padding:4px; border-radius:14px; gap:2px; margin:0 auto; }
.seg button { position:relative; z-index:1; height:36px; padding:0 16px; border-radius:10px; font-weight:600; color:var(--ink2); transition:color .25s var(--ease); white-space:nowrap; }
.seg button.on { color:#fff; }
.seg .pill { position:absolute; top:4px; height:36px; border-radius:10px; background:var(--primary); box-shadow:0 4px 12px rgba(43,71,117,.35); transition:transform .45s var(--spring), width .45s var(--spring); }
.live { display:flex; align-items:center; gap:10px; height:48px; padding:0 16px; border-radius:16px; font-size:13px; color:var(--ink2); white-space:nowrap; }
.live .dot { width:9px; height:9px; border-radius:50%; background:var(--sage); box-shadow:0 0 0 0 rgba(89,127,96,.45); animation:beat 2.4s infinite; }
@keyframes beat { 0% { box-shadow:0 0 0 0 rgba(89,127,96,.45); } 70% { box-shadow:0 0 0 9px rgba(89,127,96,0); } 100% { box-shadow:0 0 0 0 rgba(89,127,96,0); } }
.live b { color:var(--ink); } .live .sep { width:1px; height:18px; background:var(--line); }

/* ── left sheet ── */
.sheet { position:fixed; top:80px; left:16px; bottom:104px; width:388px; border-radius:var(--radius); display:flex; flex-direction:column; overflow:hidden; z-index:4; }
.sum { padding:18px 20px 16px; border-bottom:1px solid var(--line); }
.eyebrow { font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.02em; display:flex; justify-content:space-between; align-items:center; }
.eyebrow .when { color:var(--primary); background:var(--tint); border-radius:999px; padding:3px 9px; font-size:11.5px; transition:background .3s; }
.sentence { font-size:17px; line-height:1.5; letter-spacing:-.2px; margin-top:8px; font-weight:500; min-height:52px; }
.sentence b { font-weight:800; }
.kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:0; border-bottom:1px solid var(--line); }
.kpi { padding:14px 12px 14px 20px; border-right:1px solid var(--line); }
.kpi:last-child { border-right:0; }
.kpi .v { font-size:28px; font-weight:800; letter-spacing:-.03em; line-height:1.05; }
.kpi .v small { font-size:12px; font-weight:700; color:var(--muted); margin-left:2px; letter-spacing:0; }
.kpi .l { font-size:11.5px; color:var(--muted); margin-top:4px; font-weight:600; white-space:nowrap; }
.kpi.zero .v { color:#b5bdc6; }
.lhead { display:flex; align-items:center; justify-content:space-between; padding:14px 20px 8px; }
.lhead b { font-size:13px; color:var(--ink2); }
.mseg { position:relative; display:flex; padding:3px; background:rgba(15,30,50,.05); border-radius:10px; }
.mseg button { position:relative; z-index:1; height:28px; padding:0 12px; border-radius:8px; font-size:12.5px; font-weight:700; color:var(--muted); transition:color .25s; }
.mseg button.on { color:var(--ink); }
.mseg .pill { position:absolute; top:3px; height:28px; border-radius:8px; background:var(--surface); box-shadow:0 1px 3px rgba(15,30,50,.15); transition:transform .4s var(--spring), width .4s var(--spring); }
.list { flex:1; overflow:auto; padding:0 10px 12px; scrollbar-width:thin; }
.row { display:grid; grid-template-columns:70px 1fr 14px; gap:10px; align-items:center; padding:11px 10px; border-radius:14px; cursor:pointer; transition:background .2s; position:relative; }
.row:hover { background:rgba(15,30,50,.04); }
.row.sel { background:var(--tint); }
.row.sel::before { content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:3px; background:var(--primary); }
.row .big { text-align:left; }
.row .big .v { font-size:26px; font-weight:800; letter-spacing:-.03em; line-height:1; }
.row .big .u { font-size:10px; font-weight:800; color:var(--muted); letter-spacing:.06em; margin-top:3px; }
.row .nm { font-weight:700; font-size:14.5px; letter-spacing:-.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .st { font-size:12px; color:var(--ink2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .st .w { color:var(--warn); font-weight:700; } .row .st .c { color:var(--crit); font-weight:700; }
.strip { display:grid; grid-template-columns:repeat(12,1fr); gap:2px; margin-top:7px; }
.strip i { height:5px; border-radius:2px; background:var(--cell); transition:background .4s; }
.row .chev { color:#b5bdc6; }
.row.dim .big .v { color:#aeb6bf; }

/* ── detail ── */
.detail { position:fixed; top:80px; right:16px; bottom:104px; width:392px; border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; z-index:4; transform:translateX(calc(100% + 24px)); opacity:0; transition:transform .6s var(--spring), opacity .35s var(--ease); }
.detail.open { transform:none; opacity:1; }
.dhead { display:flex; justify-content:space-between; align-items:flex-start; padding:18px 20px 12px; }
.dhead .cat { font-size:12px; color:var(--muted); font-weight:600; }
.dhead h2 { margin:3px 0 0; font-size:21px; letter-spacing:-.4px; }
.x { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:rgba(15,30,50,.06); color:var(--ink2); transition:background .2s, transform .2s; }
.x:hover { background:rgba(15,30,50,.1); transform:rotate(90deg); }
.dbody { flex:1; overflow:auto; padding:0 16px 16px; display:flex; flex-direction:column; gap:12px; scrollbar-width:thin; }
.hero { position:relative; overflow:hidden; border-radius:18px; padding:18px; color:#fff; background:linear-gradient(160deg,#30405a 0%,#4c5d78 55%,#7d8a9f 100%); transition:background .6s; min-height:152px; }
.hero.clear { background:linear-gradient(160deg,#4a78b0 0%,#7fa6d3 60%,#b9d0ea 100%); }
.hero.cloudy { background:linear-gradient(160deg,#556275 0%,#7d8898 60%,#a7b0bd 100%); }
.hero::after { content:""; position:absolute; inset:-40px; background-image:repeating-linear-gradient(104deg, rgba(255,255,255,.0) 0 10px, rgba(255,255,255,.22) 10px 11px, rgba(255,255,255,0) 11px 22px); opacity:0; transition:opacity .6s; animation:rain .55s linear infinite; pointer-events:none; -webkit-mask-image:linear-gradient(180deg,#000,transparent 85%); mask-image:linear-gradient(180deg,#000,transparent 85%); }
.hero.rain::after { opacity:1; }
.hero.heavy::after { background-image:repeating-linear-gradient(104deg, rgba(255,255,255,0) 0 6px, rgba(255,255,255,.3) 6px 7.2px, rgba(255,255,255,0) 7.2px 13px); animation-duration:.4s; }
@keyframes rain { from { transform:translate(0,0); } to { transform:translate(-6px,26px); } }
.hero .wm { position:absolute; right:-18px; bottom:-26px; width:126px; height:126px; border:2px dashed rgba(255,255,255,.22); border-radius:18px; transform:rotate(-8deg); display:grid; place-items:center; text-align:center; font-size:10px; color:rgba(255,255,255,.38); line-height:1.3; }
.hero .t1 { display:flex; align-items:center; gap:6px; font-size:12.5px; opacity:.85; font-weight:600; position:relative; }
.hero .t2 { font-size:64px; font-weight:800; letter-spacing:-.05em; line-height:1; margin-top:8px; position:relative; }
.hero .t3 { font-size:14.5px; margin-top:8px; line-height:1.45; max-width:88%; position:relative; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 10px; border-radius:999px; font-size:12px; font-weight:600; background:rgba(15,30,50,.05); color:var(--ink2); }
.chip.warn { background:var(--warn-bg); color:var(--warn); } .chip.crit { background:var(--crit-bg); color:var(--crit); }
.tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.tile { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 10px 9px; }
.tile .l { display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--muted); font-weight:600; }
.tile .l .ic { width:13px; height:13px; }
.tile .v { font-size:21px; font-weight:800; letter-spacing:-.03em; margin-top:4px; }
.tile .v small { font-size:11px; color:var(--muted); font-weight:700; margin-left:1px; letter-spacing:0; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; }
.card h3 { margin:0 0 10px; font-size:13px; color:var(--ink2); display:flex; justify-content:space-between; align-items:center; }
.card h3 span { font-weight:500; color:var(--muted); font-size:11.5px; }
.tl { position:relative; }
.tl-row { display:grid; grid-template-columns:40px 1fr; align-items:center; gap:6px; margin-top:6px; }
.tl-row > span { display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--ink2); font-weight:600; }
.tl-row > span .ic { width:12px; height:12px; }
.cells { display:grid; grid-template-columns:repeat(25,1fr); gap:2px; }
.cells i { height:16px; border-radius:3px; background:var(--cell); transform-origin:bottom; transform:scaleY(.2); opacity:0; transition:transform .5s var(--spring), opacity .3s, background .4s; }
.tl.shown .cells i { transform:none; opacity:1; }
.cells i.now { box-shadow:inset 0 0 0 1.5px var(--ink); }
.hours { display:grid; grid-template-columns:repeat(25,1fr); gap:2px; margin-left:46px; font-size:10px; color:var(--muted); }
.hours b { font-weight:500; text-align:center; white-space:nowrap; } .hours b.k { color:var(--ink); font-weight:800; }
.spark { height:40px; position:relative; }
.spark svg { width:100%; height:40px; display:block; overflow:visible; }
.spark path.line { fill:none; stroke:var(--ink2); stroke-width:1.8; stroke-linejoin:round; stroke-dasharray:600; stroke-dashoffset:600; transition:stroke-dashoffset 1.1s var(--ease); }
.tl.shown .spark path.line { stroke-dashoffset:0; }
.spark path.area { fill:url(#tgrad); opacity:0; transition:opacity .8s .3s; } .tl.shown .spark path.area { opacity:1; }
.spark .lo, .spark .hi { position:absolute; right:0; font-size:10px; color:var(--muted); } .spark .hi { top:-4px; } .spark .lo { bottom:-2px; }
.cursor { position:absolute; top:-2px; bottom:0; width:2px; border-radius:2px; background:var(--primary); left:0; transition:left .35s var(--spring); pointer-events:none; }
.cursor::before { content:attr(data-label); position:absolute; top:-18px; left:50%; transform:translateX(-50%); font-size:10px; font-weight:800; color:var(--primary); white-space:nowrap; }
.note { font-size:11px; color:var(--muted); margin-top:10px; line-height:1.45; }
.info { display:flex; gap:10px; font-size:12.5px; color:var(--ink2); line-height:1.5; } .info .ic { color:var(--muted); margin-top:2px; }
.info a { color:var(--primary); font-weight:700; text-decoration:none; }
.actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px 16px 16px; border-top:1px solid var(--line); background:rgba(253,253,253,.6); }
.btn { height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:7px; font-weight:800; font-size:14px; transition:transform .15s var(--ease), box-shadow .2s, background .2s; }
.btn:active { transform:scale(.97); }
.btn.pri { background:var(--primary); color:#fff; box-shadow:0 6px 16px rgba(43,71,117,.32); } .btn.pri:hover { background:var(--primary-2); }
.btn.sec { background:var(--surface); border:1px solid var(--line); } .btn.sec:hover { background:#f5f7f9; }

/* ── scrubber ── */
.scrub { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); width:min(720px, calc(100vw - 32px)); height:68px; border-radius:20px; display:flex; align-items:center; gap:14px; padding:0 18px 0 12px; z-index:5; }
.play { width:44px; height:44px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center; flex:none; box-shadow:0 6px 16px rgba(43,71,117,.32); transition:transform .15s; }
.play:active { transform:scale(.92); } .play .ic { width:18px; height:18px; fill:currentColor; stroke:none; }
.track { position:relative; flex:1; height:44px; cursor:pointer; touch-action:none; }
.rail { position:absolute; left:0; right:0; top:14px; height:6px; border-radius:3px; background:var(--cell); overflow:hidden; }
.rail .fill { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,var(--primary),var(--primary-2)); border-radius:3px; transition:width .35s var(--spring); }
.ticks { position:absolute; left:0; right:0; top:26px; display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted); }
.ticks b { font-weight:600; width:0; display:flex; justify-content:center; white-space:nowrap; } .ticks b.k { color:var(--ink); font-weight:800; }
.knob { position:absolute; top:6px; width:22px; height:22px; margin-left:-11px; border-radius:50%; background:#fff; box-shadow:0 0 0 5px rgba(43,71,117,.18), 0 2px 8px rgba(15,30,50,.25); transition:left .35s var(--spring), transform .2s; }
.track.drag .knob { transform:scale(1.18); transition:transform .2s; }
.bubble { position:absolute; bottom:52px; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:12px; font-weight:700; padding:6px 10px; border-radius:10px; white-space:nowrap; transition:left .35s var(--spring); box-shadow:0 6px 18px rgba(15,30,50,.25); }
.bubble::after { content:""; position:absolute; left:50%; bottom:-5px; width:10px; height:10px; background:var(--ink); transform:translateX(-50%) rotate(45deg); border-radius:2px; }

/* ── map chrome ── */
.mapctl { position:fixed; right:424px; bottom:104px; display:flex; flex-direction:column; gap:8px; z-index:3; transition:right .6s var(--spring); }
body.nodetail .mapctl { right:16px; }
.mapctl button { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; color:var(--ink2); }
.mapctl button.on { background:var(--primary); color:#fff; border-color:transparent; }
.legend { position:fixed; left:420px; bottom:104px; border-radius:14px; padding:9px 12px; display:flex; align-items:center; gap:10px; font-size:11.5px; color:var(--ink2); z-index:3; transition:opacity .4s; }
.legend .ramp { display:flex; gap:2px; } .legend .ramp i { width:20px; height:8px; border-radius:2px; }
.legend .ticks2 { display:flex; gap:12px; color:var(--muted); font-size:10.5px; }
.legend .src { color:var(--muted); font-size:10.5px; border-left:1px solid var(--line); padding-left:10px; }
body.norain .legend { opacity:0; }

/* ── markers ── */
.mk { position:relative; display:flex; align-items:center; gap:6px; cursor:pointer; transform:scale(0); transition:transform .5s var(--spring); }
.mk.in { transform:scale(1); }
.mk .d { width:14px; height:14px; border-radius:50%; background:var(--c, #b8c0c9); border:3px solid #fff; box-shadow:0 2px 6px rgba(15,30,50,.3); transition:background .4s, transform .35s var(--spring), box-shadow .3s; }
.mk.big .d { width:18px; height:18px; }
.mk .lab { background:rgba(253,253,253,.95); border-radius:9px; padding:4px 8px; font-size:12px; font-weight:700; color:var(--ink); white-space:nowrap; box-shadow:0 2px 8px rgba(15,30,50,.16); transition:background .3s, color .3s, transform .3s var(--spring); }
.mk .lab em { font-style:normal; font-weight:800; margin-left:3px; } .mk .lab .mu { font-weight:600; color:var(--muted); margin-left:3px; }
.mk.sel .d { transform:scale(1.3); box-shadow:0 0 0 6px rgba(43,71,117,.25), 0 2px 8px rgba(15,30,50,.3); }
.mk.sel .lab { background:var(--primary); color:#fff; } .mk.sel .lab .mu { color:rgba(255,255,255,.75); }
.mk:hover .lab { transform:translateY(-1px); }
.mk.hid { display:none; }
.cl { display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; border-radius:999px; background:rgba(253,253,253,.95); box-shadow:0 4px 14px rgba(15,30,50,.22); cursor:pointer; font-weight:700; font-size:12.5px; transform:scale(0); transition:transform .5s var(--spring); white-space:nowrap; }
.cl.in { transform:scale(1); } .cl:hover { transform:scale(1.04); }
.cl .n { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; color:#fff; background:var(--c); font-weight:800; }
.cl.hid { display:none; }

/* ── modal & toast ── */
.scrim { position:fixed; inset:0; background:rgba(15,25,40,.28); backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity .3s; z-index:9; }
.scrim.open { opacity:1; pointer-events:auto; }
.modal { position:fixed; left:50%; top:50%; width:min(560px, calc(100vw - 32px)); max-height:80vh; transform:translate(-50%,-46%) scale(.96); opacity:0; pointer-events:none; transition:transform .5s var(--spring), opacity .25s; z-index:10; border-radius:24px; background:var(--surface); box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden; }
.modal.open { transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto; }
.modal header { display:flex; justify-content:space-between; align-items:center; padding:18px 20px 10px; } .modal header b { font-size:17px; }
.modal pre { margin:0 20px; padding:16px; background:#f4f6f8; border-radius:14px; font-family:inherit; font-size:13.5px; line-height:1.65; white-space:pre-wrap; overflow:auto; max-height:52vh; color:var(--ink); }
.modal footer { display:flex; gap:8px; padding:14px 20px 18px; } .modal footer .btn { flex:1; }
.toast { position:fixed; left:50%; bottom:104px; transform:translate(-50%,20px); opacity:0; background:var(--ink); color:#fff; padding:12px 16px; border-radius:14px; display:flex; align-items:center; gap:8px; font-weight:700; font-size:13.5px; box-shadow:var(--shadow); transition:transform .45s var(--spring), opacity .25s; z-index:11; pointer-events:none; }
.toast.show { transform:translate(-50%,0); opacity:1; }
.toast .ic { color:#8fe0b4; }

/* ── intro ── */
.intro-hide { opacity:0; transform:translateY(-10px); }
.sheet.intro-hide { transform:translateX(-24px); }
.fade { transition:opacity .6s var(--ease), transform .7s var(--spring); }
.row.pre { opacity:0; transform:translateX(-10px); } .row { transition:background .2s, opacity .45s var(--ease), transform .45s var(--ease); }
.proto { position:fixed; left:16px; bottom:24px; font-size:11px; color:var(--muted); z-index:2; max-width:380px; line-height:1.4; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
.brand { background:#fff !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; }
.logo-img { display:block; width:auto; }
</style>

<script>
(() => {
const RAMP = ["#cde2fb","#9ec5f4","#5598e7","#256abf","#0d366b"], BINS = [0.1,1,3,10,30];
const WIND = ["#e7ecf1","#c9e6dd","#6fb9a2","#2a7d66"];

const $ = s => document.querySelector(s);
const state = { h:0, sel:null, sort:"r", rainLayer:true };

const rStep = v => { let s = -1; BINS.forEach((b,i) => { if (v >= b) s = i; }); return s; };

const rCell = v => { const s = rStep(v); return s < 0 ? "var(--cell)" : RAMP[s]; };

const hourLabel = h => { if (h === 0) return "지금"; const f = SITES[0].fc[h-1]; return (f.d !== SITES[0].fc[0].d ? "내일 " : "") + Number(f.h) + "시"; };
const whenLabel = h => h === 0 ? `${NOWLABEL} 실측` : `${hourLabel(h)} 예보`;

function tween(el, to, dec = 0, dur = 700) {
  const from = parseFloat(el.dataset.v || "0"); el.dataset.v = to;
  if (REDUCED || from === to) { el.textContent = to.toFixed(dec) + (el.dataset.suffix || ""); return; }
  const t0 = performance.now();
  const suf = el.dataset.suffix || "", token = (el._tw = (el._tw || 0) + 1);
  const step = now => { if (el._tw !== token) return; const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = (from + (to - from) * e).toFixed(dec) + suf; if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
  setTimeout(() => { if (el._tw === token) el.textContent = to.toFixed(dec) + suf; }, dur + 60);
}

/* ── summary sentence ── */
function sentence(h) {
  const vs = SITES.map(s => ({ s, v: val(s, h) }));
  const rainy = vs.filter(x => x.v.r > 0).sort((a,b) => b.v.r - a.v.r);
  const warn = SITES.filter(s => s.warn.length).length;
  const tail = warn ? `기상청 특보 ${warn}건이 발효 중입니다.` : "기상청 특보는 없습니다.";
  if (!rainy.length) return `${h === 0 ? "지금" : hourLabel(h) + " 예보상"} 비 오는 현장이 없습니다. ${tail}`;
  const top = rainy[0];
  if (h === 0) {
    const f = top.s.fc.slice(0, 6).map(x => x.r).reduce((a,b) => Math.max(a,b), 0);
    const gap = f < top.v.r / 4 ? `(예보는 ${f <= 0.5 ? "1mm 미만" : f + "mm"})` : "";
    return `<b>${top.s.short}에 지금 시간당 ${fmtR(top.v.r, 0)}mm</b>의 ${top.v.r >= 15 ? "강한 비" : "비"}가 관측됩니다${gap}. 그 밖에 ${rainy.length - 1}곳에 비. ${tail}`;
  }
  return `${hourLabel(h)} 예보상 <b>${rainy.length}곳에 비</b>, 가장 많은 곳은 ${top.s.short}(${fmtR(top.v.r, h)}mm). ${tail}`;
}

/* ── list ── */
const UNIT = { r:"MM/H", w:"M/S", t:"°C" };
function statusLine(s, h) {
  if (s.warn.length) return `<span class="w">${s.warn[0].title} 발효</span>`;
  if (s.legal.length) return `<span class="w">법정 확인 필요</span>`;
  const v = val(s, h), fc = s.fc.slice(h, h + 12);
  const nextRain = fc.findIndex(x => x.r > 0);
  if (v.r > 0) {
    const wet = fc.filter(x => x.r > 0);
    if (!wet.length) return `${h === 0 ? "지금 비" : "비"} · 예보상 곧 그침`;
    const mx = Math.max(...wet.map(x => x.r));
    return `${h === 0 ? "지금 비" : "비"} · 예보상 ${Number(wet[wet.length - 1].h)}시까지 ${mx <= 0.5 ? "약한 비" : "비"}`;
  }
  if (nextRain >= 0) return `예보상 ${Number(fc[nextRain].h)}시부터 비`;
  const sky = (fc[0] || {}).sky || "맑음"; return `${sky} · 특보 없음`;
}
function buildList() {
  const L = $("#list"); L.innerHTML = "";
  SITES.forEach((s, i) => {
    const el = document.createElement("div"); el.className = "row pre"; el.dataset.i = i;
    el.innerHTML = `<div class="big"><div class="v num"></div><div class="u"></div></div><div><div class="nm">${s.name}</div><div class="st"></div><div class="strip">${"<i></i>".repeat(12)}</div></div><svg class="ic chev"><use href="#i-chev"/></svg>`;
    el.onclick = () => select(i, true);
    L.appendChild(el); s.row = el;
  });
}

function renderList(animateOrder) {
  const h = state.h, m = state.sort;
  const order = SITES.map((s, i) => i).sort((a, b) => {
    const pa = SITES[a].warn.length || SITES[a].legal.length, pb = SITES[b].warn.length || SITES[b].legal.length;
    if (pa !== pb) return pb - pa;
    return metric(SITES[b], h, m) - metric(SITES[a], h, m);
  });
  const first = new Map(); if (animateOrder && !REDUCED) SITES.forEach(s => first.set(s.row, s.row.getBoundingClientRect().top));
  const L = $("#list"); order.forEach(i => L.appendChild(SITES[i].row));
  SITES.forEach(s => {
    const v = metric(s, h, m), r = s.row;
    r.querySelector(".v").textContent = m === "r" ? fmtR(v, h) : m === "w" ? v.toFixed(1) : v.toFixed(1);
    r.querySelector(".u").textContent = UNIT[m];
    r.classList.toggle("dim", m === "r" ? v === 0 : m === "w" ? v < 1 : false);
    r.querySelector(".st").innerHTML = statusLine(s, h);
    const cells = r.querySelectorAll(".strip i");
    cells.forEach((c, k) => { const f = k === 0 ? val(s, h) : s.fc[h + k - 1]; c.style.background = !f ? "var(--cell)" : m === "w" ? wCol(f.w) : m === "t" ? `rgba(25,39,60,${Math.max(.08, Math.min(.7, (f.t - 12) / 22))})` : rCell(f.r); });
  });
  if (first.size) SITES.forEach(s => { const d = first.get(s.row) - s.row.getBoundingClientRect().top; if (d) { s.row.style.transition = "none"; s.row.style.transform = `translateY(${d}px)`; requestAnimationFrame(() => { s.row.style.transition = ""; s.row.style.transform = ""; }); } });
}

/* ── KPIs ── */
function renderKpis() {
  const h = state.h, vs = SITES.map(s => val(s, h).r);
  const rainy = vs.filter(v => v > 0), mx = Math.max(0, ...vs);

  const top = SITES[vs.indexOf(mx)];
  $("#rainMaxL").textContent = mx > 0 ? `최대 · ${top.short}` : "최대 시간당";
  $("#when").textContent = whenLabel(h);
  $("#sentence").innerHTML = sentence(h);

    Object.entries(GROUPS).forEach(([g, info]) => {
      const mem = SITES.filter(s => s.grp === g); const lon = mem.reduce((a,s) => a + s.lon, 0) / mem.length, lat = mem.reduce((a,s) => a + s.lat, 0) / mem.length;
      const el = document.createElement("div"); el.className = "cl";
      el.onclick = e => { e.stopPropagation(); map.flyTo({ center:[lon,lat], zoom:info.zoom + .3, padding:pad(), speed:1.1, essential:true }); };
      clusters[g] = { el, mem, mk:new maplibregl.Marker({ element:el }).setLngLat([lon, lat]).addTo(map) };
    });
    renderMarkers(); map.on("zoom", applyClusters); applyClusters();
    mapReady = true; clearTimeout(mapFail); $("#mapMsg").classList.remove("show"); introMap();
  });
  // 숨은 탭에서는 브라우저가 그리기를 늦추므로, 화면이 보이는 동안의 대기 시간만 센다.
  let waited = 0; const tick = () => { if (mapReady) return; if (!document.hidden) waited += 500;
    if (waited >= 9000) $("#mapMsg").classList.add("show"); else mapFail = setTimeout(tick, 500); };
  mapFail = setTimeout(tick, 500);
}
let mapReady = false, mapFail = null;
function rainGeo(h) { return { type:"FeatureCollection", features:SITES.map(s => ({ type:"Feature", properties:{ r:val(s,h).r }, geometry:{ type:"Point", coordinates:[s.lon, s.lat] } })) }; }
function renderMarkers() {
  const h = state.h;
  markers.forEach(({ s, el }) => { const v = val(s, h); el.style.setProperty("--c", v.r > 0 ? rCol(v.r) : "#b8c0c9"); el.classList.toggle("big", v.r >= 10); el.querySelector(".lab").innerHTML = markerHTML(s, h); el.classList.toggle("sel", state.sel === s); });
  Object.values(clusters).forEach(c => { const mx = Math.max(...c.mem.map(s => val(s,h).r)); c.el.style.setProperty("--c", mx > 0 ? rCol(mx) : "#9aa4ae");
    c.el.innerHTML = `<span class="n">${c.mem.length}</span>${GROUPS[c.mem[0].grp].name} · ${mx > 0 ? `비 최대 ${fmtR(mx,h)}` : "비 없음"}`; });
  if (map && map.getSource && map.getSource("rain")) map.getSource("rain").setData(rainGeo(h));
}
function applyClusters() {
  if (!map || !markers.length) return;
  const z = map.getZoom();
  Object.entries(clusters).forEach(([g, c]) => { const on = z < GROUPS[g].zoom; c.el.classList.toggle("hid", !on); c.mem.forEach(s => markers.find(m => m.s === s).el.classList.toggle("hid", on && state.sel !== s)); });
}
const pad = () => ({ left:420, right:document.body.classList.contains("nodetail") ? 40 : 430, top:90, bottom:110 });

/* ── detail ── */
function heroClass(s, h) { const v = val(s,h); if (v.r >= 15) return "rain heavy"; if (v.r > 0) return "rain"; const sky = h === 0 ? (s.fc[0] || {}).sky : v.sky; return sky === "맑음" ? "clear" : "cloudy"; }
function heroSentence(s, h) {
  const v = val(s, h), fc = s.fc.slice(h, h + 12);
  if (h === 0 && v.r > 0) { const mx = Math.max(0, ...s.fc.slice(0,6).map(f => f.r)); const rain = s.fc.filter(f => f.r > 0).slice(0, 12);
    const span = rain.length ? `${Number(rain[0].h)}시~${Number(rain[rain.length-1].h)}시 ${mx <= 0.5 ? "약한 비" : "비"}` : "비 그침";
    return `<b>지금 시간당 ${fmtR(v.r,0)}mm의 ${v.r >= 15 ? "강한 비" : "비"}.</b> 기상청 예보는 ${span}.`; }
  const nextRain = fc.findIndex(x => x.r > 0);
  if (v.r > 0) return `<b>${hourLabel(h)} 예보상 시간당 ${fmtR(v.r,h)}mm 비.</b>`;
  return nextRain >= 0 ? `<b>${h === 0 ? "지금은 비 없음." : hourLabel(h) + " 예보상 비 없음."}</b> ${Number(fc[nextRain].h)}시부터 비 예보.` : `<b>${h === 0 ? "지금" : hourLabel(h)} 특이 기상 없음.</b> 12시간 내 비 예보도 없습니다.`;
}
function renderDetail(first) {
  const s = state.sel; if (!s) return; const h = state.h, v = val(s, h);
  $("#dCat").textContent = `${s.cat} 현장`; $("#dName").textContent = s.name;
  const hero = $("#hero"); hero.className = "hero " + heroClass(s, h);
  $("#hWhen").textContent = whenLabel(h); tween($("#hTemp"), v.t, 1, 600);
  $("#hSent").innerHTML = heroSentence(s, h);
  $("#dChips").innerHTML = (s.warn.length ? s.warn.map(w => `<span class="chip warn">${w.title}</span>`).join("") : `<span class="chip">기상특보 없음</span>`) + (s.legal.length ? `<span class="chip warn">법정 확인 필요</span>` : `<span class="chip">법정조치 해당 없음</span>`);
  const feels = h === 0 ? s.now.feels : v.t;
  const tiles = [["i-drop","비",fmtR(v.r,h),"mm/h"],["i-wind","바람",v.w.toFixed(1),"m/s"],["i-temp","체감",feels.toFixed(1),"°"],["i-hum","습도",v.reh ?? "-","%"]];
  $("#dTiles").innerHTML = tiles.map(([ic,l,n,u]) => `<div class="tile"><div class="l"><svg class="ic"><use href="#${ic}"/></svg>${l}</div><div class="v num">${n}<small>${u}</small></div></div>`).join("");
  if (first) buildTimeline(s);
  moveCursor();
}
function buildTimeline(s) {
  const tl = $("#tl"); tl.classList.remove("shown");
  const all = [ { r:s.now.r, w:s.now.w, t:s.now.t }, ...s.fc.slice(0, 24) ];
  $("#cR").innerHTML = all.map((f, k) => `<i class="${k===0?"now":""}" style="background:${rCell(f.r)};transition-delay:${k*18}ms" title="${k===0?"지금 실측":hourLabel(k)+" 예보"} · ${fmtR(f.r,k)}mm"></i>`).join("");
  $("#cW").innerHTML = all.map((f, k) => `<i class="${k===0?"now":""}" style="background:${wCol(f.w)};transition-delay:${k*18+120}ms" title="${f.w}m/s"></i>`).join("");
  const ts = all.map(f => f.t), lo = Math.min(...ts), hi = Math.max(...ts), n = all.length;
  const pts = ts.map((t, k) => [((k + .5) / n) * 100, 34 - ((t - lo) / Math.max(1, hi - lo)) * 28 + 2]);
  const d = pts.map((p, k) => (k ? "L" : "M") + p[0].toFixed(2) + " " + p[1].toFixed(2)).join(" ");
  $("#spark").innerHTML = `<svg viewBox="0 0 100 40" preserveAspectRatio="none"><path class="area" d="${d} L${pts[n-1][0]} 40 L${pts[0][0]} 40 Z"/><path class="line" d="${d}" vector-effect="non-scaling-stroke" pathLength="600"/></svg><span class="hi num">${hi}°</span><span class="lo num">${lo}°</span>`;
  $("#hours").innerHTML = all.map((f, k) => `<b class="${k===0?"k":""}">${k===0?"지금":(k%3===0?Number(s.fc[k-1].h):"")}</b>`).join("");
  const dry = s.fc.slice(0,24).every(f => f.r === 0);
  $("#tlNote").textContent = `지금 칸은 ${NOWLABEL} 실측, 나머지는 기상청 단기예보(14시 발표)입니다.` + (s.now.r > 5 && s.fc.slice(0,3).every(f => f.r <= 0.5) ? " 실측이 예보보다 훨씬 많습니다." : "") + (dry && s.now.r === 0 ? " 24시간 내 비 예보가 없습니다." : "");
  requestAnimationFrame(() => requestAnimationFrame(() => tl.classList.add("shown")));
}
function moveCursor() {
  const cells = $("#cR"); if (!cells.firstChild) return;
  const c = cells.children[state.h], tl = $("#tl").getBoundingClientRect(), r = c.getBoundingClientRect();
  const cur = $("#cursor"); cur.style.left = (r.left - tl.left + r.width / 2 - 1) + "px"; cur.dataset.label = state.h === 0 ? "지금" : hourLabel(state.h);
}
function select(i, fly) {
  const s = SITES[i], first = state.sel !== s; state.sel = s;
  SITES.forEach(x => x.row.classList.toggle("sel", x === s));
  document.body.classList.remove("nodetail"); $("#detail").classList.add("open");
  renderMarkers(); applyClusters(); renderDetail(first);
  if (fly && map) map.flyTo({ center:[s.lon, s.lat], zoom:Math.max(map.getZoom(), s.grp === "cap" ? 10.6 : s.grp === "jin" ? 11.5 : 8.5), padding:pad(), speed:REDUCED ? 10 : 0.9, curve:1.35, essential:true });
  s.row.scrollIntoView({ block:"nearest", behavior:REDUCED ? "auto" : "smooth" });
}
function closeDetail() { state.sel = null; $("#detail").classList.remove("open"); document.body.classList.add("nodetail"); SITES.forEach(x => x.row.classList.remove("sel")); renderMarkers(); applyClusters(); }

/* ── scrubber ── */
const MAXH = 24;
function buildTicks() { $("#ticks").innerHTML = Array.from({ length:MAXH + 1 }, (_, h) => `<b class="${h===0?"k":""}">${h===0?"지금":(h%3===0?hourLabel(h).replace("내일 ",""):"")}</b>`).join(""); }
function setHour(h, fromUser) {
  h = Math.max(0, Math.min(MAXH, Math.round(h))); if (h === state.h && fromUser !== "force") return; state.h = h;
  const pct = h / MAXH * 100; $("#knob").style.left = pct + "%"; $("#fill").style.width = pct + "%";
  const b = $("#bubble"); b.style.left = pct + "%"; b.textContent = h === 0 ? `지금 · ${NOWLABEL} 실측` : `${hourLabel(h)} 예보`;
  renderKpis(); renderList(true); renderMarkers(); if (state.sel) renderDetail(false);
}
function bindScrub() {
  const tr = $("#track"); let drag = false;
  const at = e => { const r = tr.getBoundingClientRect(); return (e.clientX - r.left) / r.width * MAXH; };
  tr.addEventListener("pointerdown", e => { drag = true; tr.classList.add("drag"); tr.setPointerCapture(e.pointerId); stop(); setHour(at(e), true); });
  tr.addEventListener("pointermove", e => { if (drag) setHour(at(e), true); });
  tr.addEventListener("pointerup", () => { drag = false; tr.classList.remove("drag"); });
  document.addEventListener("keydown", e => { if (e.target.closest && e.target.closest("input")) return; if (e.key === "ArrowRight") setHour(state.h + 1, true); if (e.key === "ArrowLeft") setHour(state.h - 1, true); if (e.key === "Escape") { closeModal(); } });
  let timer = null; const btn = $("#play");
  function stop() { clearInterval(timer); timer = null; btn.querySelector("use").setAttribute("href", "#i-play"); }
  btn.onclick = () => { if (timer) return stop(); if (state.h >= MAXH) setHour(0, true); btn.querySelector("use").setAttribute("href", "#i-pause");
    timer = setInterval(() => { if (state.h >= MAXH) return stop(); setHour(state.h + 1, true); }, 650); };
}

/* ── segmented controls ── */
function segPill(seg) { const on = seg.querySelector("button.on"), pill = seg.querySelector(".pill"); pill.style.width = on.offsetWidth + "px"; pill.style.transform = `translateX(${on.offsetLeft - 4 + (seg.id === "sortSeg" ? 1 : 0)}px)`; }
function bindSegs() {
  const nav = $("#nav");
  nav.querySelectorAll("button").forEach(b => b.onclick = () => { if (b.dataset.v === "notice") { openNotice(null); return; }
    nav.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); segPill(nav);
    if (b.dataset.v === "list") toast("현장 목록 화면은 다음 프로토타입에서 보여드립니다"); });
  const ss = $("#sortSeg");
  ss.querySelectorAll("button").forEach(b => b.onclick = () => { ss.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); segPill(ss); state.sort = b.dataset.m; renderList(true); });
  segPill(nav); segPill(ss);
}

/* ── notice modal ── */
const ACTIONS = { r:["배수로 및 침사지 주변 이물질 정비","토사 유실 우려 구간 덮개 보양","침수 우려 구역 내 장비 안전지대 이동"] };
function noticeText(s) {
  const lines = ["■ 공지드립니다.", ""];
  if (!s) {
    const rainy = SITES.filter(x => x.now.r > 0).sort((a,b) => b.now.r - a.now.r);
    lines.push(`2026-09-25 ${NOWLABEL} 기준 현장 기상현황을 공유드립니다.`, "", `${rainy.slice(0,3).map(x => x.short).join("、")} 등 ${rainy.length}개 현장에 비가 관측되고 있으며,`, `특히 ${rainy[0].short} 현장은 시간당 ${fmtR(rainy[0].now.r,0)}mm의 강한 비가 관측되고 있습니다.`, "기상청 특보는 발표되지 않았습니다.", "", "【수방 안전관리 사항】");
  } else if (s.now.r > 0) {
    lines.push(`2026-09-25 ${NOWLABEL} 기준, ${s.name} 현장에 시간당 ${fmtR(s.now.r,0)}mm의 ${s.now.r >= 15 ? "강한 비가" : "비가"} 관측되고 있습니다.`);
    if (s.now.r > 5 && s.fc.slice(0,3).every(f => f.r <= 0.5)) lines.push("(기상청 예보는 1mm 미만으로, 실측과 차이가 있습니다.)");
    lines.push("", "【수방 안전관리 사항】");
  } else { lines.push(`2026-09-25 ${NOWLABEL} 기준, ${s.name} 현장은 특이 기상상황이 없습니다.`, ""); return lines.concat(["감사합니다."]).join("\n"); }
  ACTIONS.r.forEach(a => lines.push("ㅇ " + a));
  lines.push("", "각 현장에서는 수방 조치가 실제 이행될 수 있도록 관리하여 주시기 바랍니다.", "", "감사합니다.");
  return lines.join("\n");
}
function openNotice(s) { $("#mTitle").textContent = s ? `전파 문안 · ${s.short}` : "전파 문안 · 전 현장"; $("#mText").textContent = noticeText(s); $("#scrim").classList.add("open"); $("#modal").classList.add("open"); }
function closeModal() { $("#scrim").classList.remove("open"); $("#modal").classList.remove("open"); }
function toast(t) { $("#toastT").textContent = t; const el = $("#toast"); el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2200); }

/* ── intro ── */
function introPanels() {
  const els = [...document.querySelectorAll(".intro-hide")];
  els.forEach((el, k) => setTimeout(() => el.classList.remove("intro-hide"), REDUCED ? 0 : 80 + k * 70));
  setTimeout(() => { renderKpis();
    [...$("#list").children].forEach((r, k) => setTimeout(() => r.classList.remove("pre"), REDUCED ? 0 : k * 35)); }, REDUCED ? 0 : 350);
  setTimeout(() => {
    select(SITES.indexOf([...SITES].sort((a,b) => b.now.r - a.now.r)[0]), false);
    if (mapReady) map.fitBounds([[125.6,34.1],[130.1,38.75]], { padding:pad(), duration:REDUCED ? 0 : 1200 });
  }, REDUCED ? 0 : 1300);
}
function introMap() {
  const c = map.getCenter();
  markers.slice().sort((a, b) => Math.hypot(a.s.lon - c.lng, a.s.lat - c.lat) - Math.hypot(b.s.lon - c.lng, b.s.lat - c.lat))
    .forEach((m, k) => setTimeout(() => m.el.classList.add("in"), REDUCED ? 0 : 150 + k * 40));
  Object.values(clusters).forEach(c2 => setTimeout(() => c2.el.classList.add("in"), REDUCED ? 0 : 500));
  renderMarkers(); applyClusters();
  map.fitBounds([[125.6,34.1],[130.1,38.75]], { padding:pad(), duration:REDUCED ? 0 : 1000 });
}

/* ── wire up ── */
buildList(); buildTicks(); bindScrub(); bindSegs(); renderList(false); setHour(0, "force");
$("#dClose").onclick = closeDetail; $("#bNotice").onclick = () => openNotice(state.sel);
$("#bSite").onclick = () => toast("현장 화면(모바일) 프로토타입은 다음 단계에서 보여드립니다");
$("#mClose").onclick = closeModal; $("#mCancel").onclick = closeModal; $("#scrim").onclick = closeModal;
$("#mCopy").onclick = async () => { try { await navigator.clipboard.writeText($("#mText").textContent); } catch (e) {} closeModal(); toast("전파 문안을 복사했습니다"); };
$("#layerBtn").onclick = () => { state.rainLayer = !state.rainLayer; $("#layerBtn").classList.toggle("on", state.rainLayer); document.body.classList.toggle("norain", !state.rainLayer); if (map.getLayer("rain")) map.setLayoutProperty("rain", "visibility", state.rainLayer ? "visible" : "none"); };
$("#zIn").onclick = () => map.zoomIn(); $("#zOut").onclick = () => map.zoomOut();
$("#zHome").onclick = () => map.fitBounds([[125.6,34.1],[130.1,38.75]], { padding:pad(), duration:REDUCED ? 0 : 1200 });
map = null; buildMap(); introPanels();
window.addEventListener("resize", () => { segPill($("#nav")); segPill($("#sortSeg")); moveCursor(); });
window.__proto = { setHour: h => setHour(h, true), select: i => select(i, true) };
})();
</script>
