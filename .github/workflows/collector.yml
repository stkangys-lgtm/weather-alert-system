name: Weather Collector

on:
  schedule:
    # 현장 운영시간(KST 04:00~18:00)에만 매시 45분 실행. GitHub Actions 스케줄은 UTC 기준이므로
    # KST 04~17시(운영시간)를 UTC로 환산: UTC 19~23시(전날) + UTC 0~8시(당일) = "0-8,19-23".
    # 분(45) 값은 시간대와 무관하게 동일. 야간(KST 18~04시)에는 현장이 없어 실행하지 않음으로써
    # GitHub Actions 무료 사용량(월 2,000분) 소진을 줄인다.
    - cron: "45 0-8,19-23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
      KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SITES_JSON: ${{ secrets.SITES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python -m src.main

      # docs/index.html(대시보드), docs/announcement.txt(공고문)는 개인정보를 담지 않으므로
      # 저장소에 커밋해 GitHub Pages로 게시한다. 변경이 없으면 커밋을 건너뛴다.
      - name: 대시보드 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/announcement.txt
          git diff --cached --quiet || git commit -m "대시보드 자동 갱신 [skip ci]"
          git push
