name: Weather Collector

on:
  schedule:
    # KST 04:17~17:47 운영. :17/:47 이중 실행으로 예약 지연·누락을 보완하고
    # 정각 혼잡을 피한다. UTC 기준 시간 범위는 KST보다 9시간 이전이다.
    - cron: "17 0-8,19-23 * * *"
    - cron: "47 0-8,19-23 * * *"
  workflow_dispatch: {}

concurrency:
  group: weather-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
      KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
      # 선택 설정: 기상청 API Hub 현재 특보 조회용 키
      KMA_API_HUB_KEY: ${{ secrets.KMA_API_HUB_KEY }}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SITES_JSON: ${{ secrets.SITES_JSON }}
      # 선택 설정: 알림톡 발송사/사내 중계 Webhook이 준비되기 전에는 비워 둔다.
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_WEBHOOK_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
      # :17은 직전 주 실행이 누락되거나 45분 이상 지연됐을 때만 실제 수집한다.
      COLLECTION_MODE: ${{ github.event_name == 'schedule' && startsWith(github.event.schedule, '17 ') && 'backup' || 'primary' }}
      # :17 보완 실행에서는 대량의 동일 예보행을 다시 적재하지 않는다.
      WRITE_FORECAST_HISTORY: ${{ github.event_name != 'schedule' || startsWith(github.event.schedule, '47 ') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python -m src.main

      # docs/index.html(대시보드), docs/announcement.txt(공고문)는 개인정보를 담지 않으므로
      # 저장소에 커밋해 GitHub Pages로 게시한다. 변경이 없으면 커밋을 건너뛴다.
      - name: 대시보드 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all -- docs
          git diff --cached --quiet || git commit -m "대시보드 자동 갱신 [skip ci]"
          git push
