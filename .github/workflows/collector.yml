name: Weather Collector

on:
  schedule:
    # 현장 운영시간(KST 04:00~18:00)에만 매시 45분 실행. GitHub Actions 스케줄은 UTC 기준이므로
    # KST 04~17시(운영시간)를 UTC로 환산: UTC 19~23시(전날) + UTC 0~8시(당일) = "0-8,19-23".
    # 분(45) 값은 시간대와 무관하게 동일. 야간(KST 18~04시)에는 현장이 없어 실행하지 않음으로써
    # GitHub Actions 무료 사용량(월 2,000분) 소진을 줄인다.
    - cron: "45 0-8,19-23 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
      KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SITES_JSON: ${{ secrets.SITES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python -m src.main
