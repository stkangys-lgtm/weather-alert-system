name: Weather Collector

on:
  schedule:
    # KST 04:17~17:47 운영. :17/:47 이중 실행으로 예약 지연·누락을 보완하고
    # 정각 혼잡을 피한다. UTC 기준 시간 범위는 KST보다 9시간 이전이다.
    - cron: "17 0-8,19-23 * * *"
    - cron: "47 0-8,19-23 * * *"
  # GitHub 예약 실행은 자주 누락·지연되므로(2026-10 실측 하루 6~8회) 외부 예약 서비스가
  # 한국시각 04~17시 :17·:47마다 mode=auto로 이 실행을 요청한다. 사람이 Actions 화면에서
  # 직접 실행하면 manual(항상 수집)이다. 설정 방법: design/ops/external-trigger.md
  workflow_dispatch:
    inputs:
      mode:
        description: "manual: 항상 수집 / auto: 외부 예약 서비스용(:17 보완·:47 주 실행)"
        type: choice
        options:
          - manual
          - auto
        default: manual

concurrency:
  group: weather-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # 현장별 단기예보·실황과 중기예보를 순차 조회하므로 기상청 응답이
    # 느린 날에도 21개 현장을 끝까지 처리할 수 있도록 여유를 둔다.
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
      # 선택 설정: 기상청 API Hub 현재 특보 조회용 키
      KMA_API_HUB_KEY: ${{ secrets.KMA_API_HUB_KEY }}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SITES_JSON: ${{ secrets.SITES_JSON }}
      # 선택 설정: 알림톡 발송사/사내 중계 Webhook이 준비되기 전에는 비워 둔다.
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_WEBHOOK_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
      # 기존 문체 학습·승인 전까지는 비밀값이 등록돼 있어도 외부 발송을 강제로 차단한다.
      NOTIFICATION_MODE: shadow
      # 실행 종류(src/schedule.py): GitHub 예약 :17=보완(직전 수집이 45분 넘었을 때만),
      # :47=주 실행(20분 안에 이미 수집했으면 건너뜀), 외부 예약 auto=한국시각 분으로 판단,
      # 직접 실행=항상 수집. 보완 실행은 대량의 동일 예보행을 다시 적재하지 않는다.
      COLLECTION_MODE: ${{ github.event_name == 'schedule' && (startsWith(github.event.schedule, '17 ') && 'backup' || 'primary') || inputs.mode || 'manual' }}
    steps:
      # 대기열에서 기다린 실행도 직전 실행 결과(docs/)를 보도록 이벤트 당시 커밋이
      # 아니라 브랜치 최신본을 받는다(중복 수집·푸시 거절 방지).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python -m src.main

      # docs/index.html(대시보드), docs/announcement.txt(공고문)는 개인정보를 담지 않으므로
      # 저장소에 커밋해 GitHub Pages로 게시한다. 변경이 없으면 커밋을 건너뛴다.
      - name: 대시보드 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all -- docs
          git diff --cached --quiet || git commit -m "대시보드 자동 갱신 [skip ci]"
          # 실행 중에 코드 변경이 올라왔어도 푸시가 거절되지 않도록 원격 최신본 위에 얹는다.
          git pull --rebase origin main
          git push origin HEAD:main
